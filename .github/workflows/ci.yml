name: CI

on:
  push:
    branches: [main]
  # base를 걸러내지 않는다. 스택 PR(앞선 PR의 브랜치를 base로 삼는 PR)에도
  # CI가 붙어야 하는데, `branches: [main]` 이면 스택의 2번째부터는 base가
  # main이 될 때까지 아무 잡도 돌지 않는다.
  pull_request:

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Sorbet is the only type checker. Steep, the `sig/` RBS tree and the
      # `rbs collection` were removed on 2026-08-05: the inline `#:` comments
      # stayed, because `--enable-experimental-rbs-comments` in sorbet/config
      # makes Sorbet read them straight from the .rb source. Nothing generates
      # .rbs files anymore, so there is no sync step and no drift to check.
      #
      # Static only -- no database or credentials needed. The RBI files under
      # sorbet/rbi are committed, so this never regenerates them; if they drift
      # from Gemfile.lock, run `bundle exec tapioca gem` and commit the result.
      #
      # Every file under app/lib/test carries an explicit sigil: ~297 at
      # `# typed: true` (where Sorbet enforces signatures and constant/method
      # resolution) and the rest at `# typed: false` (syntax and RBI drift
      # only). Widen by re-running `bundle exec spoom srb bump . --dry`, which
      # lists the files that would type check cleanly at the next level up.
      #
      # KNOWN GAP: 60 files carry `#:` annotations but sit at `# typed: false`,
      # where Sorbet ignores signatures entirely. Steep used to check those;
      # nothing does now. Bumping all 60 to `true` currently costs 353 errors,
      # overwhelmingly srb.help/7003 (unknown method) from incomplete gem RBIs,
      # so it is a follow-up: fill the RBI gaps with `bundle exec tapioca gem`
      # first, then bump.
      #
      # A NEW file with no sigil defaults to `false` and is therefore invisible
      # to this gate -- add one when creating files.
      - name: Type check with Sorbet
        run: bundle exec srb tc

      # `srb tc` reads sorbet/rbi/gems but never asks whether those RBIs still
      # match Gemfile.lock, so a stale one is invisible to it. Removing the
      # steep gem on 2026-08-05 left steep@2.0.0.rbi and five of its transitive
      # dependencies (listen, rb-fsevent, rb-inotify, fileutils, strscan)
      # behind, and everything stayed green. This step is what would have
      # caught that.
      #
      # No database or credentials needed, despite sorbet/tapioca/require.rb
      # booting config/environment: the boot populates
      # ActiveRecord::Base.configurations but opens no connection, every
      # `ENV.fetch` on the boot path carries a default block (so a missing
      # .env is fine), and nothing reads Rails credentials -- verified by
      # booting with a deliberately wrong RAILS_MASTER_KEY, which would raise
      # on the first decryption.
      #
      # Fix a failure with `bin/tapioca gem` and commit the result.
      - name: Check gem RBIs match Gemfile.lock
        run: bundle exec tapioca gem --verify

  test:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    services:
      postgres:
        # Public image, so no credentials: Dependabot-triggered runs cannot read
        # Actions secrets, and an empty password makes the whole job invalid.
        image: ghcr.io/stadia/ra-pg:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Prepare database
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ra-news_test
        run: bin/rails db:create db:migrate

      # RSpec를 먼저 실행해 커버리지를 계측하고, 이어서 Minitest를 실행한다.
      # 두 스텝은 같은 job의 동일한 coverage/ 디렉토리를 공유하므로 결과가 병합되며,
      # Minitest의 at_exit(persist_result!)가 마지막에 돌아 병합된 최종 스냅샷을 저장한다.
      - name: Run RSpec with coverage
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ra-news_test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          PGGSSENCMODE: disable
        run: bundle exec rspec

      - name: Run tests with coverage
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ra-news_test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          PGGSSENCMODE: disable
        run: bin/rails test

      # db/schema.rb가 커밋돼 있으면 빈 DB의 `db:migrate`는 마이그레이션을 실행하지
      # 않고 schema.rb를 로드한다(위 Prepare database도 그렇다). 그러면 마이그레이션과
      # schema.rb가 어긋나도 CI가 알 수 없다. 별도 DB에서 schema.rb 없이 전체
      # 마이그레이션을 실제로 돌리고, 그 덤프가 커밋된 파일과 같은지 비교한다.
      #
      # 실패하면 로컬에서 같은 절차(schema.rb 치우고 새 DB에 db:migrate)로 덤프해 커밋한다.
      # `!cancelled()`: 테스트가 실패해도 드리프트 여부는 따로 알려 준다.
      - name: Check db/schema.rb matches migrations
        if: ${{ !cancelled() }}
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ra-news_schema_check
        run: |
          mv db/schema.rb "$RUNNER_TEMP/schema.committed.rb"
          bin/rails db:create:primary db:migrate:primary
          diff -u "$RUNNER_TEMP/schema.committed.rb" db/schema.rb

  # 테스트 프로파일링. 결과는 Actions 요약 화면에 바로 뜨고, Vernier
  # 플레임그래프는 아티팩트로 받아 profiler.firefox.com 에 올린다.
  #
  # PR이 아니라 main push에만 돈다. 계측 고유 비용은 15초 남짓인데, 별도 잡을
  # 두는 한 셋업(Ruby 설치·libvips·컨테이너)이 통째로 중복되고 test 잡과
  # 병렬로 같은 캐시·네트워크를 다투느라 잡 하나가 3분을 먹었다 -- PR 파이프라인
  # 벽시계가 2분에서 3분으로 늘어난다. 프로파일은 회귀 추이를 보는 용도라
  # 머지마다 쌓이면 충분하다.
  #
  # `continue-on-error`: 계측이 깨져도 머지를 막지 않는다. 테스트 통과 여부는
  # test 잡이 판정한다.
  profile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      packages: write

    services:
      postgres:
        # Public image, so no credentials: Dependabot-triggered runs cannot read
        # Actions secrets, and an empty password makes the whole job invalid.
        image: ghcr.io/stadia/ra-pg:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ra-news_test
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      PGGSSENCMODE: disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Prepare database
        run: bin/rails db:create db:migrate

      # 프로파일러 ENV는 잡이 아니라 스텝에만 건다. 잡 레벨에 두면 test-prof가
      # Bundler.require로 부팅 때 실려 있는 탓에 `db:create db:migrate`까지
      # 프로파일돼, 접미사 없는 Vernier 리포트가 아티팩트에 섞인다.
      #
      # 두 러너의 Vernier 산출물은 같은 파일명을 쓰므로 TEST_PROF_REPORT로
      # 접미사를 갈라 뒤 실행이 앞 실행을 덮어쓰지 않게 한다.
      #
      # `|| true`: 프로파일 실행이 실패해도 요약과 아티팩트는 남겨야 한다.
      # 테스트 통과 여부는 test 잡이 판정하므로 여기서 중단할 이유가 없다.
      - name: Profile minitest
        env:
          EVENT_PROF: sql.active_record
          EVENT_PROF_TOP: "10"
          TAG_PROF: type
          TEST_VERNIER: "1"
          TEST_PROF_REPORT: minitest
        run: bin/rails test 2>&1 | tee tmp/profile-minitest.log || true

      - name: Profile RSpec
        env:
          EVENT_PROF: sql.active_record
          EVENT_PROF_TOP: "10"
          TAG_PROF: type
          TEST_VERNIER: "1"
          TEST_PROF_REPORT: rspec
        run: bundle exec rspec 2>&1 | tee tmp/profile-rspec.log || true

      - name: Write step summary
        run: |
          bin/test-profile-summary \
            minitest:tmp/profile-minitest.log \
            rspec:tmp/profile-rspec.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profile artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-profile
          path: |
            tmp/test_prof/
            tmp/profile-*.log
          retention-days: 7

