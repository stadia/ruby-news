name: Releasee

on:
  push:
    # branches: [ v*.*.* ]
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/stadia/ra-news
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: ghcr.io/stadia/ra-news:latest
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: arc-runner-set
    needs: docker

    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment/ruby-news-web -n default
          kubectl rollout restart deployment/ruby-news-worker -n default

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ruby-news-web -n default --timeout=300s
          kubectl rollout status deployment/ruby-news-worker -n default --timeout=300s

      - name: Notify Honeybadger deployment
        env:
          HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_API_KEY }}
        if: ${{ success() && env.HONEYBADGER_API_KEY != '' }}
        run: |
          curl -fsS https://api.honeybadger.io/v1/deploys \
            --data-urlencode "deploy[environment]=production" \
            --data-urlencode "deploy[local_username]=${{ github.actor }}" \
            --data-urlencode "deploy[revision]=${{ github.sha }}" \
            --data-urlencode "deploy[repository]=${{ github.server_url }}/${{ github.repository }}" \
            --data-urlencode "api_key=${HONEYBADGER_API_KEY}"
